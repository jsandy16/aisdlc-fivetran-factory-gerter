# pipeline.yaml: identity, trigger, tasks, reliability, observability, workload, cost.
# Synthetic test pipeline: the s3_to_s3_event starter, filled in for dev.
api_version: factory/v1
kind: Pipeline
schema_version: 1.0.0
metadata:
  pipeline_id: unit_s3_event
  name: "S3 to S3 copy"
  description: "Copy every new object from the source bucket to the archive bucket."
  team: clinops_data
  spec_version: 0.1.0
  owners: {business_owner: "@alice-ba", data_engineer: "@bob-de", governance: "@carol-qa", platform: "@dan-platform"}
  requirements: []
  tags: {cost_centre: CC1234}
variables:
  bucket: trigger.object.bucket
  key: trigger.object.key
  version_id: trigger.object.version_id
trigger:
  type: s3_event
  queue: object_created
  max_receive_count: 5
  key_prefix: incoming/
orchestration:
  dag: {catchup: false, max_active_runs: 2, timeout: 4h}
  tasks:
    - task_id: t1_copy
      label: Copy the new object
      rules: [r_read_event, r_list_object, r_copy]
      engine: lambda
      timeout: 10m
reliability:
  run_key: "{bucket}-{key}-{version_id}"
  retry: {max_attempts: 3, backoff: exponential_jitter, base: 10s, max: 5m}
  replay_window: 30d
observability:
  alerts: {transient: none, data: data_owner, config: platform, security: security}
  sla: 3h
workload:
  bytes_per_run: {p50: 10MB, p95: 500MB, max: 2GB}
  files_per_run: {p50: 1, p95: 1, max: 1}
  runs_per_day: 500
cost: {budget_per_run_usd: "0.01", budget_per_month_usd: "5.00"}
open_questions: []
