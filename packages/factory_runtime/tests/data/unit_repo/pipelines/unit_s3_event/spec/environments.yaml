# environments.yaml: per-environment bindings. Owner: platform. Placement aliases come from the platform settings.
environments:
  dev:
    enabled: true
    placement: {orchestration: mwaa, workload: team}
    secrets: {aws_secrets_manager: {prefix: factory/}}
    queues: {object_created: {name: unit-object-created-dev}}
    sources:
      source_bucket: {buckets: [unit-source-dev], prefix_roots: [incoming/], placement: team}
    alert_channels:
      data_owner: {type: sns, topic: unit-data-alerts-dev}
      platform: {type: sns, topic: unit-platform-alerts-dev}
      security: {type: sns, topic: unit-security-alerts-dev}
