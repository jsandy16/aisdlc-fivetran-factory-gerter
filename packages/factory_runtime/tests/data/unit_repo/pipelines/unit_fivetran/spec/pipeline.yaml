# pipeline.yaml: identity, trigger, tasks, reliability, observability, workload, cost.
# Synthetic test pipeline (the table_to_s3_fivetran starter, filled in) for the fivetran.sync runtime tests.
api_version: factory/v1
kind: Pipeline
schema_version: 1.0.0
metadata:
  pipeline_id: unit_fivetran
  name: "CRM tables to the lake"
  description: "Replicate the CRM database tables into the data lake with Fivetran every six hours."
  team: clinops_data
  spec_version: 0.1.0
  owners: {business_owner: "@alice-ba", data_engineer: "@bob-de", governance: "@carol-qa", platform: "@dan-platform"}
  requirements: []
  tags: {cost_centre: CC1234}
variables:
  run_date: trigger.schedule.run_date
trigger:
  type: schedule
  cron: "0 */6 * * *"
orchestration:
  dag: {catchup: false, max_active_runs: 2, timeout: 4h}
  tasks:
    - task_id: t1_sync
      label: Run the Fivetran sync
      rules: [r_sync]
      engine: fivetran_native
      timeout: 2h
reliability:
  run_key: "{run_date}"
  retry: {max_attempts: 3, backoff: exponential_jitter, base: 10s, max: 5m}
  replay_window: 30d
observability:
  alerts: {transient: none, data: data_owner, config: platform, security: security}
  sla: 3h
workload:
  bytes_per_run: {p50: 100MB, p95: 1GB, max: 5GB}
  files_per_run: {p50: 0, p95: 0, max: 0}
  runs_per_day: 4
cost: {budget_per_run_usd: "1.00", budget_per_month_usd: "120.00"}
open_questions: []
