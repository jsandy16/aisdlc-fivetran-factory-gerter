[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factory-agents"
version = "0.2.0.dev0"
description = "Pipeline Factory agents (Claude Agent SDK): isolated sessions, record/replay, the LLM boundary, gates"
requires-python = ">=3.11"
dependencies = ["factory-spec", "factory-runtime", "pydantic>=2.9,<3"]

[project.optional-dependencies]
live = ["claude-agent-sdk==0.2.165"]   # only for live calls and recording; CI replays recordings

[tool.hatch.build.targets.wheel]
packages = ["src/factory_agents"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "factory_agents/plugin"
