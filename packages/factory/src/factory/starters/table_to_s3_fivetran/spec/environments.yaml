# environments.yaml: per-environment bindings. Owner: platform. Placement aliases come from the platform settings.
environments:
  dev:
    enabled: true
    placement: {orchestration: mwaa, workload: team}
    secrets: {aws_secrets_manager: {prefix: factory/}}
    sources:
      crm_db: {fivetran_group: "<REQUIRED>"}
    alert_channels:
      data_owner: {type: sns, topic: "<REQUIRED>"}
      platform: {type: sns, topic: "<REQUIRED>"}
      security: {type: sns, topic: "<REQUIRED>"}
  test:
    enabled: true
    placement: {orchestration: mwaa, workload: team}
