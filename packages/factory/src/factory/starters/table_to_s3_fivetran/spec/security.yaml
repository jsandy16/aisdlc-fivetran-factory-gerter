# security.yaml: governance decisions. Owner: governance / QA.
security_and_access:
  gxp_tier: "<REQUIRED>"                     # non_gxp | gxp_indirect | gxp_direct (decided with QA)
  data_classification: "<REQUIRED>"          # public | internal | confidential | restricted
  encryption_at_rest: {staging: sse_kms, s3_destinations: sse_kms}
  package_encryption: none            # done outside the pipeline for now (ADR-0012)
  checksums: {manifest: [sha256], delivery_sidecars: []}
  audit:
    enabled: true
    events: [delivery, destination_resolution, portal_call, rule_result, secret_access]
    evidence_retention: 10y
  retention: {staging_after_success: 7d, staging_after_failure: 30d, run_logs: 400d}
  residency: {allowed_regions: ["<REQUIRED>"]}
