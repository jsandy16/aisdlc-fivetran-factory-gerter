[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factory"
version = "0.2.0.dev0"
description = "Pipeline Factory CLI"
requires-python = ">=3.11"
dependencies = ["factory-spec", "typer>=0.27,<0.28"]

[project.optional-dependencies]
agents = ["factory-agents"]   # `factory agent ...` and `factory accept`

[project.scripts]
factory = "factory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]
