[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factory-spec"
version = "0.2.0.dev0"
description = "Pipeline Factory spec v1: Pydantic models, validators, lock, JSON Schema export, migrations"
requires-python = ">=3.11"
dependencies = [
  "factory-core[yaml,cel]",
  "pydantic==2.14.1",          # exact: exported JSON Schema bytes depend on it
  "jmespath==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/factory_spec"]
