[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-factory"
version = "0.1.0"
description = "AI-SDLC pipeline factory: spec-driven Fivetran Connector SDK pipelines with governance outside Fivetran"
requires-python = ">=3.11"  # tomllib (generate/cicd.py)
dependencies = [
  "pydantic>=2.9,<3",
  "ruamel.yaml>=0.18,<0.20",
  "jinja2>=3.1,<4",
  "cel-python==0.5.0",
]

[project.optional-dependencies]
# Source drivers used by the runtime; also needed to run connectors locally.
runtime = ["paramiko>=3.5,<6", "psycopg2-binary>=2.9,<3", "pymysql>=1.1,<2", "boto3>=1.35"]
# LLM steps (requirements intake, English rule compilation) run through the Claude Agent SDK.
agent = ["claude-agent-sdk==0.2.165"]
# Requirement documents in Word or PDF format.
docs = ["python-docx>=1.1", "pypdf>=4"]
# Local deployment and test tooling.
fivetran = ["fivetran-connector-sdk==2.12.1"]
dev = ["pytest>=8", "asyncssh>=2.14", "pyopenssl", "pyftpdlib>=2", "moto[server]>=5", "duckdb>=1.1", "pytz", "python-hcl2>=7"]

[project.scripts]
pf = "pf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pf = ["generate/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs local SFTP/FTP/Postgres/S3 servers (started by the fixtures)", "tester: runs the real Fivetran local tester (fivetran debug)"]
