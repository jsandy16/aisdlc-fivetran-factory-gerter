# Generated by pipeline-factory 0.1.0 from pipelines/oncology_labs (spec sha256 b956e99048976c16).
# Do not edit: change the specs and run `pf build oncology_labs`.
name: pf oncology_labs

on:
  pull_request:
    paths:
      - 'pipelines/oncology_labs/**'
      - 'src/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'pipelines/oncology_labs/**'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write  # OIDC to AWS for artefact upload

concurrency:
  group: pf-oncology-labs-${{ github.ref }}
  cancel-in-progress: false  # never cancel a deploy half-way

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipeline-factory
        run: pip install -e '.[runtime,fivetran,dev]'
      - name: Validate specs
        run: pf validate oncology_labs
      - name: Generated files match the specs (no hand edits, nothing stale)
        run: pf build oncology_labs --check
      - name: Break-and-verify tests on fixtures
        run: pf test oncology_labs
      - name: Version bump matches the change
        run: pf release oncology_labs --check

  deploy-dev:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev  # configure required reviewers for production environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipeline-factory
        run: pip install -e '.[runtime,fivetran]'
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PF_AWS_REGION }}
      - name: Store the versioned release artefact (write-once)
        run: pf release oncology_labs --upload s3://${{ vars.PF_ARTEFACT_BUCKET }}
      - name: Deploy to Fivetran and apply the schedule
        run: pf deploy oncology_labs --env dev
        env:
          FIVETRAN_API_KEY: ${{ secrets.FIVETRAN_API_KEY }}
          PF_SECRET_ORIGINALS_ACCESS_KEY_ID_DEV: ${{ secrets.PF_ORIGINALS_ACCESS_KEY_ID_DEV }}
          PF_SECRET_ORIGINALS_SECRET_ACCESS_KEY_DEV: ${{ secrets.PF_ORIGINALS_SECRET_ACCESS_KEY_DEV }}
          PF_SECRET_SFTP_PRIVATE_KEY: ${{ secrets.PF_SFTP_PRIVATE_KEY }}
          PF_SECRET_SUBJECT_KEY_SALT: ${{ secrets.PF_SUBJECT_KEY_SALT }}

  deploy-prod:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod  # configure required reviewers for production environments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipeline-factory
        run: pip install -e '.[runtime,fivetran]'
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PF_AWS_REGION }}
      - name: Store the versioned release artefact (write-once)
        run: pf release oncology_labs --upload s3://${{ vars.PF_ARTEFACT_BUCKET }}
      - name: Deploy to Fivetran and apply the schedule
        run: pf deploy oncology_labs --env prod
        env:
          FIVETRAN_API_KEY: ${{ secrets.FIVETRAN_API_KEY }}
          PF_SECRET_ORIGINALS_ACCESS_KEY_ID_PROD: ${{ secrets.PF_ORIGINALS_ACCESS_KEY_ID_PROD }}
          PF_SECRET_ORIGINALS_SECRET_ACCESS_KEY_PROD: ${{ secrets.PF_ORIGINALS_SECRET_ACCESS_KEY_PROD }}
          PF_SECRET_SFTP_PRIVATE_KEY: ${{ secrets.PF_SFTP_PRIVATE_KEY }}
          PF_SECRET_SUBJECT_KEY_SALT: ${{ secrets.PF_SUBJECT_KEY_SALT }}
