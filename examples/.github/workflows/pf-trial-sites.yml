# Generated by pipeline-factory 0.1.0 from pipelines/trial_sites (spec sha256 d4cafee52eb723d9).
# Do not edit: change the specs and run `pf build trial_sites`.
name: pf trial_sites

on:
  pull_request:
    paths:
      - 'pipelines/trial_sites/**'
      - 'pf.toml'
  push:
    branches: [main]
    paths:
      - 'pipelines/trial_sites/**'
      - 'pf.toml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pf-trial-sites-${{ github.ref }}
  cancel-in-progress: false  # never cancel a deploy half-way

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pipeline-factory
        run: pip install 'pipeline-factory[runtime,fivetran]==0.1.0'
      - name: Validate specs
        run: pf validate trial_sites
      - name: Generated files match the specs (no hand edits, nothing stale)
        run: pf build trial_sites --check
      - name: Break-and-verify tests on fixtures
        run: pf test trial_sites
      - name: Version bump matches the change
        run: pf release trial_sites --check

  deploy-dev:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC to AWS, deploy jobs only
    environment: dev  # configure required reviewers for production environments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pipeline-factory
        run: pip install 'pipeline-factory[runtime,fivetran]==0.1.0'
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.PF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PF_AWS_REGION }}
      - name: Store the versioned release artefact (write-once)
        run: pf release trial_sites --upload s3://${{ vars.PF_ARTEFACT_BUCKET }}
      - name: Deploy to Fivetran and apply the schedule
        run: pf deploy trial_sites --env dev
        env:
          FIVETRAN_API_KEY: ${{ secrets.FIVETRAN_API_KEY }}
          PF_SECRET_RDS_CA_BUNDLE: ${{ secrets.PF_RDS_CA_BUNDLE }}
          PF_SECRET_RDS_PASSWORD: ${{ secrets.PF_RDS_PASSWORD }}

  deploy-prod:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC to AWS, deploy jobs only
    environment: prod  # configure required reviewers for production environments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pipeline-factory
        run: pip install 'pipeline-factory[runtime,fivetran]==0.1.0'
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.PF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PF_AWS_REGION }}
      - name: Store the versioned release artefact (write-once)
        run: pf release trial_sites --upload s3://${{ vars.PF_ARTEFACT_BUCKET }}
      - name: Deploy to Fivetran and apply the schedule
        run: pf deploy trial_sites --env prod
        env:
          FIVETRAN_API_KEY: ${{ secrets.FIVETRAN_API_KEY }}
          PF_SECRET_RDS_CA_BUNDLE: ${{ secrets.PF_RDS_CA_BUNDLE }}
          PF_SECRET_RDS_PASSWORD: ${{ secrets.PF_RDS_PASSWORD }}
