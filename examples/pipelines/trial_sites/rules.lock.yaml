lock_version: 1
rules:
  activated_on_required_when_active:
    scope: row
    location: sttm.yaml:entities.0.row_checks.0
    text: When STATUS is exactly ACTIVE (upper case), ACTIVATED_ON must be present. For any other STATUS, or a missing 
      STATUS, ACTIVATED_ON is not checked.
    text_sha256: 8c1085e9c50c53427388c335bce1cc3ed765a2b4b81b7c9a45cde2c3d8aefcfa
    expression: row.status == null || row.status != "ACTIVE" || row.activated_on != null
    referenced:
      - row.activated_on
      - row.status
    back_translation: 'A site row is only held to account when its status is ACTIVE: in that case it must have an activated_on
      date. Rows with any other status, or no status, pass automatically.'
    passes_when:
      - status is null (missing), whatever activated_on holds
      - status is anything other than exactly "ACTIVE" (e.g. "PENDING", "CLOSED", or lowercase "active"), whatever 
        activated_on holds
      - status is exactly "ACTIVE" and activated_on has a date value
    fails_when:
      - status is exactly "ACTIVE" and activated_on is null (missing)
      - Comparison is case-sensitive, so "active" or "Active" is not treated as ACTIVE and passes without needing 
        activated_on
      - Other columns (site_id, site_name, country, enrolment_target, updated_at) are not checked; the activated_on date
        is not checked for being in the past or any range, only for being present
    ambiguities: []
    cases:
      - input:
          status: ACTIVE
          activated_on: '2023-01-15'
        expected: pass
        actual: pass
        source: owner
        why: ''
      - input:
          status: ACTIVE
          activated_on:
        expected: fail
        actual: fail
        source: owner
        why: ''
      - input:
          status: PLANNED
          activated_on:
        expected: pass
        actual: pass
        source: owner
        why: ''
      - input:
          status: ACTIVE
          activated_on: '2024-01-31'
        expected: pass
        actual: pass
        source: generated
        why: ACTIVE with activated_on present
      - input:
          status: ACTIVE
          activated_on:
        expected: fail
        actual: fail
        source: generated
        why: ACTIVE with activated_on missing
      - input:
          status: active
          activated_on:
        expected: pass
        actual: pass
        source: generated
        why: lower case is not exactly ACTIVE, so not checked
      - input:
          status: INACTIVE
          activated_on:
        expected: pass
        actual: pass
        source: generated
        why: other status, not checked
      - input:
          status:
          activated_on:
        expected: pass
        actual: pass
        source: generated
        why: missing status, not checked
      - input:
          status:
          activated_on: '2024-01-31'
        expected: pass
        actual: pass
        source: generated
        why: missing status with date present
      - input:
          status: CLOSED
          activated_on: '2024-01-31'
        expected: pass
        actual: pass
        source: generated
        why: other status with date present
      - input:
          status: 'ACTIVE '
          activated_on:
        expected: pass
        actual: pass
        source: generated
        why: trailing space is not exactly ACTIVE
