# pipeline.yaml — identity, owners, requirement summary, environments and schedule.
# Owner: product owner. Fill every <REQUIRED>; keep or change the defaults.
api_version: pf/v1
name: trial_sites                       # = Fivetran connection name = destination schema; never change after first deploy
version: 0.1.0                         # semver; `pf release` refuses a breaking change without a major bump
title: "Investigator sites from CTMS"  # from trial_sites.docx: "Requirement: Investigator sites from CTMS"
gxp_tier: "non_gxp"                       # non_gxp | gxp_indirect | gxp_direct  (decided with QA)
owners:                                # GitHub handles or @org/team — each approves the files they own (CODEOWNERS)
  product_owner: "@feasibility-po"
  data_engineer: "@rd-data-eng"
  governance: "@rd-governance"
  quality: "@rd-data-quality"
requirement:
  purpose: "Provide the current list of investigator sites for feasibility analytics."  # from trial_sites.docx: "provide the current list of investigator sites for feasibility analytics"
  consumers: ["Feasibility analytics"]
  freshness_sla_hours: 24
  late_data_policy: load_late          # wait | load_late | reject_late
  source_document: trial_sites.docx    # set by `pf intake` when drafted from a requirement document
environments: [dev, prod]
schedule:
  dev:
    sync_frequency: 1440   # minutes: 1,5,15,30,60,120,180,360,480,720,1440
    daily_sync_time:                   # "HH:MM" UTC, only with 1440
    paused: true
  prod:
    sync_frequency: 360   # minutes: 1,5,15,30,60,120,180,360,480,720,1440
    daily_sync_time:                   # "HH:MM" UTC, only with 1440
    paused: false
runtime:
  parallelism: 2                       # packages prepared in parallel (1-8); always emitted in order
  retry: {attempts: 5, base_seconds: 2.0, max_seconds: 60.0}
  checkpoint_every_rows: 5000
  python_version: "3.12"
