rules:
  visit_before_receipt:
    scope: row
    location: sttm.yaml:entities.0.row_checks.1
    text: The visit date must be on or before the date the lab received the sample. A row with either date missing 
      fails.
    text_sha256: abfec265a082e64eebcb043cbd3b74b5fd839c02c7c6ed406e3d729bd5b5dfc0
    expression: row.visit_date != null && row.received_date != null && row.visit_date <= row.received_date
    referenced:
      - row.received_date
      - row.visit_date
    back_translation: Checks that each row has both a visit_date and a received_date, and that the visit took place on 
      or before the day the record was received. A row with either date missing fails.
    passes_when:
      - visit_date and received_date are both present and visit_date is earlier than received_date
      - visit_date and received_date are both present and are the same day (the comparison is inclusive)
    fails_when:
      - visit_date is null (missing), so a null counts as a failure, not as a skipped check
      - received_date is null (missing), so a null counts as a failure, not as a skipped check
      - visit_date is later than received_date, meaning the data was received before the visit happened
