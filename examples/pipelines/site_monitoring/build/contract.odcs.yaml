  quality:
  - id: site_monitoring_lake_rows
    name: site_monitoring_lake_rows
    type: sql
    description: site_monitoring is not empty
    query: SELECT failed FROM (SELECT CASE WHEN COUNT(*) >= 1 THEN 0 ELSE 1 END 
      AS failed, COUNT(*) AS observed FROM "site_monitoring"."site_monitoring" 
      WHERE COALESCE(_fivetran_deleted, FALSE) = FALSE) q
    mustBe: 0
    severity: error
    dimension: completeness
  - id: site_monitoring_fresh
    name: site_monitoring_fresh
    type: sql
    description: site_monitoring synced within the SLA
    query: SELECT failed FROM (SELECT CASE WHEN MAX(finished_at) >= 
      CURRENT_TIMESTAMP - INTERVAL '24' HOUR THEN 0 ELSE 1 END AS failed, 
      COUNT(*) AS observed FROM "site_monitoring"."pf_package_audit" WHERE 
      COALESCE(_fivetran_deleted, FALSE) = FALSE AND status = 'loaded') q
    mustBe: 0
    severity: warning
    dimension: timeliness
  - id: site_monitoring_reconciled
    name: site_monitoring_reconciled
    type: sql
    description: Lake rows equal rows the connector emitted
    query: SELECT failed FROM (SELECT (SELECT COUNT(*) FROM 
      "site_monitoring"."site_monitoring" x WHERE COALESCE(x._fivetran_deleted, 
      FALSE) = FALSE AND NOT EXISTS (SELECT 1 FROM 
      "site_monitoring"."pf_entity_audit" a WHERE a.package_hash = 
      x.pf_package_hash AND a.entity = 'site_monitoring' AND a.status = 
      'loaded')) + (SELECT COUNT(*) FROM 
      "site_monitoring"."pf_keys_site_monitoring" k WHERE 
      COALESCE(k._fivetran_deleted, FALSE) = FALSE AND NOT EXISTS (SELECT 1 FROM
      "site_monitoring"."site_monitoring" y WHERE COALESCE(y._fivetran_deleted, 
      FALSE) = FALSE AND y.pf_key_hash = k.key_hash AND y.pf_package_hash = 
      k.package_hash)) + (SELECT COUNT(*) FROM 
      "site_monitoring"."site_monitoring" z WHERE COALESCE(z._fivetran_deleted, 
      FALSE) = FALSE AND NOT EXISTS (SELECT 1 FROM 
      "site_monitoring"."pf_keys_site_monitoring" k WHERE k.key_hash = 
      z.pf_key_hash AND COALESCE(k._fivetran_deleted, FALSE) = FALSE)) AS 
      failed, (SELECT COUNT(*) FROM "site_monitoring"."site_monitoring" WHERE 
      COALESCE(_fivetran_deleted, FALSE) = FALSE) AS observed) q
    mustBe: 0
    severity: error
    dimension: completeness
