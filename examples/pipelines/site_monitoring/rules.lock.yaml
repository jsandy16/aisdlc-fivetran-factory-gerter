lock_version: 1
rules:
  report_within_10_days:
    scope: row
    location: sttm.yaml:entities.0.row_checks.0
    text: When REPORT_DATE is present, it must be on or after VISIT_DATE and at most 10 calendar days after it (exactly 
      10 days passes). When REPORT_DATE is missing the report is not finalised yet and the row passes. When REPORT_DATE 
      is present but VISIT_DATE is missing, the row fails.
    text_sha256: 4b95af555a7d055a7a55d916e4c8f1db270535078536661e6ccf953d53643744
    expression: row.report_date == null || (row.visit_date != null && row.visit_date <= row.report_date && 
      timestamp(row.report_date + "T00:00:00Z") - timestamp(row.visit_date + "T00:00:00Z") <= duration("240h"))
    referenced:
      - row.report_date
      - row.visit_date
    back_translation: A row passes if it has no report_date. If it has one, visit_date must be present, must not be 
      after report_date, and must be no more than 10 days (240 hours) before it.
    passes_when:
      - report_date is null, whatever visit_date is.
      - report_date is present, visit_date is present, and visit_date is on or before report_date.
      - The gap between visit_date and report_date is 10 days or less. Exactly 10 days passes, and the same day passes.
    fails_when:
      - report_date is present but visit_date is null.
      - visit_date is after report_date.
      - report_date is more than 10 days (240 hours) after visit_date.
      - "Surprising: the expression adds the text \"T00:00:00Z\" to report_date and visit_date, which are declared as dates
        (NAIVE_DATE), not strings. If the engine doesn't convert dates to text for this, the check may raise an error or fail
        on every row that has a report_date, instead of giving a real answer."
    ambiguities: []
    cases:
      - input:
          visit_date: '2024-03-01'
          report_date: '2024-03-11'
        expected: pass
        actual: pass
        source: owner
        why: ''
      - input:
          visit_date: '2024-03-01'
          report_date: '2024-03-12'
        expected: fail
        actual: fail
        source: owner
        why: ''
      - input:
          visit_date: '2024-03-01'
          report_date:
        expected: pass
        actual: pass
        source: owner
        why: ''
      - input:
          visit_date: '2024-01-01'
          report_date: '2024-01-11'
        expected: pass
        actual: pass
        source: generated
        why: Exactly 10 days after passes
      - input:
          visit_date: '2024-01-01'
          report_date: '2024-01-12'
        expected: fail
        actual: fail
        source: generated
        why: 11 days after exceeds limit
      - input:
          visit_date: '2024-01-01'
          report_date: '2024-01-01'
        expected: pass
        actual: pass
        source: generated
        why: Same day (lower boundary) passes
      - input:
          visit_date: '2024-01-02'
          report_date: '2024-01-01'
        expected: fail
        actual: fail
        source: generated
        why: Report before visit fails
      - input:
          visit_date: '2024-01-01'
          report_date:
        expected: pass
        actual: pass
        source: generated
        why: Missing report date passes
      - input:
          visit_date:
          report_date: '2024-01-05'
        expected: fail
        actual: fail
        source: generated
        why: Report present but visit date missing fails
      - input:
          visit_date:
          report_date:
        expected: pass
        actual: pass
        source: generated
        why: 'Both missing: report missing passes'
      - input:
          visit_date: '2024-02-25'
          report_date: '2024-03-06'
        expected: pass
        actual: pass
        source: generated
        why: Leap-year month crossing, exactly 10 days (Feb 29 exists)
      - input:
          visit_date: '2024-01-01'
          report_date: '2024-01-05'
        expected: pass
        actual: pass
        source: generated
        why: Typical pass
