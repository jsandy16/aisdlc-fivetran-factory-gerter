  cov_zero_open_issues:
    scope: row
    location: sttm.yaml:entities.0.row_checks.1
    text: When VISIT_TYPE is exactly COV (case-sensitive), OPEN_ISSUES must be present and equal to 0. Rows with any 
      other VISIT_TYPE, or with VISIT_TYPE missing, pass this rule.
    text_sha256: 5b2efea58217c0504ccddae9e0f6d05338bc95570afad9df7306fb3b7251a0cc
    expression: row.visit_type == null || row.visit_type != "COV" || (row.open_issues != null && row.open_issues == 0)
    referenced:
      - row.open_issues
      - row.visit_type
    back_translation: A visit row is valid unless it is a close-out visit (visit_type "COV") that still has open issues.
      Visits of any other type, or with no visit_type, are not checked. A "COV" visit passes only if open_issues is 
      present and exactly 0.
    passes_when:
      - visit_type is null (the other checks are skipped).
      - visit_type is anything other than "COV" (compared case-sensitively), whatever open_issues is, including null.
      - visit_type is "COV" and open_issues is 0.
    fails_when:
      - visit_type is "COV" and open_issues is greater than 0.
      - visit_type is "COV" and open_issues is negative, because only exactly 0 passes.
      - visit_type is "COV" and open_issues is null. A missing count fails rather than being treated as zero, which may 
        be surprising.
      - visit_type is a different case such as "cov". It counts as not "COV", so it passes without any open_issues 
        check.
    ambiguities: []
    cases:
      - input:
          visit_type: COV
          open_issues: 0
        expected: pass
        actual: pass
        source: owner
        why: ''
      - input:
          visit_type: COV
          open_issues: 2
        expected: fail
        actual: fail
        source: owner
        why: ''
      - input:
          visit_type: IMV
          open_issues: 5
        expected: pass
        actual: pass
        source: owner
        why: ''
      - input:
          visit_type: COV
          open_issues: 0
        expected: pass
        actual: pass
        source: generated
        why: COV with zero open issues
      - input:
          visit_type: COV
          open_issues: 1
        expected: fail
        actual: fail
        source: generated
        why: COV with one open issue (just above boundary)
      - input:
          visit_type: COV
          open_issues: -1
        expected: fail
        actual: fail
        source: generated
        why: COV with negative value, not equal to 0
      - input:
          visit_type: COV
          open_issues:
        expected: fail
        actual: fail
        source: generated
        why: COV with missing open_issues must fail
      - input:
          visit_type: cov
          open_issues: 5
        expected: pass
        actual: pass
        source: generated
        why: Lowercase cov is not exactly COV (case-sensitive)
      - input:
          visit_type:
          open_issues: 5
        expected: pass
        actual: pass
        source: generated
        why: Missing visit_type passes
      - input:
          visit_type:
          open_issues:
        expected: pass
        actual: pass
        source: generated
        why: Both null passes
      - input:
          visit_type: SIV
          open_issues: 3
        expected: pass
        actual: pass
        source: generated
        why: Other visit type with open issues passes
      - input:
          visit_type: ''
          open_issues: 2
        expected: pass
        actual: pass
        source: generated
        why: Empty string is not COV
