# destinations.yaml: the destination allow-list per environment (ADR-0024). The portal can only choose among these.
# Owner: governance (CODEOWNERS). Part of binding_sha, not logic_sha.
destinations:
  dev:
    - {id: dev_delivery_s3, type: s3, slots: [x, y], bucket: acme-clinops-delivery-dev, prefix_pattern: "studies/{study_id}/**", placement: team, kms_key: alias/clinops-delivery-dev, max_classification: restricted}
    - {id: dev_stub_sftp, type: sftp, slots: [x, y], host: sftp-stub.dev.acme.example, port: 22, path_pattern: "/inbound/{study_id}/**", username: factory-delivery, private_key_secret: partner_sftp_key, host_key_fingerprint: "SHA256:zEA/dDcrIBhmGJxUY8UzlHhbXcFIZNehohInWBQWWmQ", max_classification: restricted, at_rest_attestation: DEV-STUB-NOT-GXP}
  test:
    - {id: test_delivery_s3, type: s3, slots: [x, y], bucket: acme-clinops-delivery-test, prefix_pattern: "studies/{study_id}/**", placement: team, kms_key: alias/clinops-delivery-test, max_classification: restricted}
    - {id: test_stub_sftp, type: sftp, slots: [x, y], host: sftp-stub.test.acme.example, port: 22, path_pattern: "/inbound/{study_id}/**", username: factory-delivery, private_key_secret: partner_sftp_key, host_key_fingerprint: "SHA256:igOmd94YxOamC/64sh+ZrG6zcyR7ROoprczu5GCx/VY", max_classification: restricted, at_rest_attestation: TEST-STUB-NOT-GXP}
  ppt:
    - {id: cro_archive_s3, type: s3, slots: [x, y], bucket: acme-cro-archive-ppt, prefix_pattern: "studies/{study_id}/packages/**", placement: cro_archive, kms_key: alias/cro-archive-inbound, max_classification: restricted}
    - {id: partner_sftp, type: sftp, slots: [x, y], host: sftp-uat.partner-cro.example.com, port: 22, path_pattern: "/inbound/acme/{study_id}/**", username: acme-delivery-uat, private_key_secret: partner_sftp_key, host_key_fingerprint: "SHA256:fEEcwQkJ8AiU1i85Rj0zuzl8pWghGQgeVP+/5P5p9b8", max_classification: restricted, at_rest_attestation: QA-ATT-2026-017}
    - {id: cro_https_upload, type: https, slots: [x], host: upload-uat.partner-cro.example.com, port: 443, path_pattern: "/api/v2/studies/{study_id}/packages/*", method: PUT, auth: {type: bearer, token_secret: cro_upload_token}, write_once: if_none_match, max_classification: restricted, at_rest_attestation: QA-ATT-2026-018}
  prod:
    - {id: cro_archive_s3, type: s3, slots: [x, y], bucket: acme-cro-archive-prod, prefix_pattern: "studies/{study_id}/packages/**", placement: cro_archive, kms_key: alias/cro-archive-inbound, max_classification: restricted}
    - {id: partner_sftp, type: sftp, slots: [x, y], host: sftp.partner-cro.example.com, port: 22, path_pattern: "/inbound/acme/{study_id}/**", username: acme-delivery, private_key_secret: partner_sftp_key, host_key_fingerprint: "SHA256:o2K6iOZLOrmaihUq2iIr8t8LMSXuBKBiG9Ve+XKxDbE", max_classification: restricted, at_rest_attestation: QA-ATT-2026-017}
    - {id: cro_https_upload, type: https, slots: [x], host: upload.partner-cro.example.com, port: 443, path_pattern: "/api/v2/studies/{study_id}/packages/*", method: PUT, auth: {type: bearer, token_secret: cro_upload_token}, write_once: if_none_match, max_classification: restricted, at_rest_attestation: QA-ATT-2026-018}
